#
# Build the bundles and draft a release. One workflow, not two: the release job
# hangs off the build jobs with `needs:`, so the artefacts never have to be
# found again across workflow runs.
#
# Tag-only by design. `origin` is Gitea with Actions disabled; it push-mirrors
# here, tags included, and force-pushed tags re-trigger. Nothing runs on an
# ordinary commit push. Note the consequence: a broken build surfaces when you
# cut a release, so use workflow_dispatch to exercise the pipeline first — it
# builds everything and skips the release job.
#
# The workflow file is read from the ref that was pushed, so a tag only builds
# if it points at a commit that already contains this file.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write        # the release job creates a draft release

jobs:
  linux:
    name: linux-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false   # one arch failing should not hide the other's result
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          # Native arm64. If the label turns out to be unavailable on a private
          # repo, fall back to qemu on ubuntu-24.04 — correct, ~5x slower.
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # git describe needs the history AND the tags, or
                           # every bundle ships stamped "unknown"

      # The packaging scripts bind-mount .git into a container that runs as
      # another uid, and git refuses a repository it thinks is someone else's.
      # That is exactly the bug that shipped 06e44ee: an arm64 bundle stamped
      # 000000/00000000 out of a green build.
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Without a minimal ffmpeg the bundle is ~190 MB instead of ~37 MB. The
      # packaging script degrades gracefully rather than failing, so a cache
      # miss that also fails to build would ship a fat bundle quietly — hence
      # the size check further down.
      - name: Cache minimal ffmpeg
        id: ffmpeg
        uses: actions/cache@v4
        with:
          path: port/deps-ffmpeg-linux-${{ matrix.arch }}
          key: ffmpeg-linux-${{ matrix.arch }}-${{ hashFiles('tools/build-ffmpeg-min.sh') }}

      - name: Build minimal ffmpeg
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: CONTAINER=docker tools/build-ffmpeg-min.sh linux ${{ matrix.arch }}

      # The script is the single source of truth for what a bundle is; the
      # workflow only chooses the container runtime. CONTAINER exists for this.
      - name: Package
        run: CONTAINER=docker tools/package-linux.sh ${{ matrix.arch }}

      # The packaging container runs as root against a bind mount, so on a real
      # Linux runner dist/ comes back owned by root and the runner cannot write
      # into it. macOS hides this: Rancher/lima translates uids, so it passes
      # locally and fails here.
      - name: Take ownership of the build output
        run: sudo chown -R "$(id -u):$(id -g)" dist

      # Check the artefact, not the build log. All three defects in the 2026-08-19
      # re-cut passed a green build. bin/theoc is invoked directly rather than
      # through the launcher, which refuses to start without the game data.
      - name: Smoke test
        run: |
          set -eu
          # Named, not globbed: package-linux.sh builds the path from the same
          # `git describe`, so deriving it the same way cannot match two bundles.
          version=$(git describe --tags --always --dirty)
          bundle="dist/theoc-linux-${{ matrix.arch }}-$version"
          echo "bundle: $bundle"
          [ -d "$bundle" ] || { echo "no bundle at $bundle" >&2; ls -la dist >&2; exit 1; }
          LD_LIBRARY_PATH="$PWD/$bundle/lib" tools/smoke-test.sh "$bundle/bin/theoc"
          size=$(du -sm "$bundle" | cut -f1)
          echo "bundle size: ${size} MB"
          if [ "$size" -gt 80 ]; then
            echo "FAIL: ${size} MB — the minimal ffmpeg did not make it in" >&2
            exit 1
          fi

      - name: Tarball
        id: tar
        run: |
          set -eu
          version=$(git describe --tags --always --dirty)
          name="theoc-linux-${{ matrix.arch }}-$version"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.tar.outputs.name }}
          path: dist/*.tar.gz
          if-no-files-found: error

  macos:
    name: macos-arm64
    runs-on: macos-15      # Apple Silicon. arm64 only, by decision: the Homebrew
                           # dependencies are per-architecture, so an Intel bundle
                           # is a second native build rather than a universal one.
    outputs:
      # The notarisation submission id, so the draft release can carry it. Empty
      # when the job built unsigned, which only a workflow_dispatch can do.
      notarization_id: ${{ steps.notarize.outputs.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # No ffmpeg here: tools/build-ffmpeg-min.sh builds the cut-down one and
      # package-macos.sh prefers it. Installing Homebrew's would only matter as
      # the fallback path, and that fallback drags x265, x264, svt-av1, libvpx,
      # dav1d and openssl into the bundle — 21 MB becomes 66 MB. Leaving it out
      # means the fallback cannot silently happen.
      #
      # `sdl2` is an alias for sdl2-compat, which is a shim over SDL3, so this
      # installs both. package-macos.sh knows and bundles SDL3 by name.
      - name: Toolchain
        run: brew install unicorn sdl2

      - name: Cache minimal ffmpeg
        id: ffmpeg
        uses: actions/cache@v4
        with:
          path: port/deps-ffmpeg-macos-arm64
          key: ffmpeg-macos-arm64-${{ hashFiles('tools/build-ffmpeg-min.sh') }}

      - name: Build minimal ffmpeg
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: tools/build-ffmpeg-min.sh macos

      # A throwaway keychain in RUNNER_TEMP, not the login keychain: the runner
      # is ephemeral, but a partition list on a shared default keychain is the
      # kind of thing that works until it silently does not. Deleted in an
      # always() step at the end.
      #
      # set-key-partition-list is the step everyone omits and then spends an
      # afternoon on: without it codesign finds the key and macOS puts up a UI
      # authorisation prompt that no one is there to answer, so the job hangs
      # rather than failing.
      - name: Import the signing certificate
        id: signing
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -eu
          if [ -z "${CERT_P12:-}" ]; then
            # A tag is a release, and a release must not ship unsigned. A
            # workflow_dispatch without secrets is a pipeline test, and being
            # able to run one without credentials is worth keeping.
            if [ "${GITHUB_REF_TYPE}" = tag ]; then
              echo "error: MACOS_CERT_P12_BASE64 is not set and this is a tag build" >&2
              echo "       a released macOS bundle must be signed and notarised" >&2
              exit 1
            fi
            echo "::warning::no signing certificate — building an unsigned bundle"
            echo "identity=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
                  -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
                  -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # Prepend rather than replace: codesign searches the whole list, and
          # dropping the system keychain breaks certificate chain validation.
          security list-keychains -d user -s "$KEYCHAIN" \
                  $(security list-keychains -d user | tr -d '"')
          # `|| true` so that finding no match falls through to the
          # diagnostic below rather than ending the step on grep's exit
          # status under `set -e`.
          identity=$(security find-identity -v -p codesigning "$KEYCHAIN" \
                     | grep 'Developer ID Application' | head -1 \
                     | sed -n 's/.*"\(.*\)".*/\1/p' || true)
          [ -n "$identity" ] || {
            echo "error: no Developer ID Application identity in the imported .p12" >&2
            echo "       an 'Apple Development' or 'Mac App Distribution' cert" >&2
            echo "       imports cleanly and cannot notarise — check which one" >&2
            echo "       was exported. Identities found:" >&2
            security find-identity -v -p codesigning "$KEYCHAIN" >&2
            exit 1
          }
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          echo "==> signing as $identity"

      - name: Package
        env:
          THEOC_CODESIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
        run: tools/package-macos.sh

      # Same artefact check as the other two platforms. It runs the signed
      # binary, which also proves the hardened runtime did not break loading —
      # though NOT that it left the JIT alone: THEOC_FIX_SAVE returns from main
      # before Unicorn is opened. That is what port/theoc.entitlements is for,
      # and it is verified there rather than here.
      - name: Smoke test
        run: |
          set -eu
          version=$(git describe --tags --always --dirty)
          bundle="dist/theoc-macos-arm64-$version"
          [ -d "$bundle" ] || { echo "no bundle at $bundle" >&2; ls -la dist >&2; exit 1; }
          tools/smoke-test.sh "$bundle/bin/theoc"
          size=$(du -sm "$bundle" | cut -f1)
          echo "bundle size: ${size} MB"
          # ~21 MB with the minimal ffmpeg, ~66 MB with Homebrew's.
          if [ "$size" -gt 40 ]; then
            echo "FAIL: ${size} MB — the minimal ffmpeg did not make it in" >&2
            exit 1
          fi

      # Notarisation takes a zip because notarytool accepts only .zip, .pkg and
      # .dmg — never a .tar.gz. That is a transport detail and nothing more: the
      # ticket Apple issues is keyed on each binary's cdhash, so the very same
      # files then ship in the .tar.gz below and Gatekeeper recognises them.
      #
      # Nothing is stapled. `stapler` writes tickets into .app/.dmg/.pkg only,
      # and this bundle is a plain directory on purpose, so first launch checks
      # with Apple online. The README says so and gives the offline escape.
      - name: Notarize
        id: notarize
        if: steps.signing.outputs.identity != ''
        env:
          NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          set -eu
          version=$(git describe --tags --always --dirty)
          bundle="dist/theoc-macos-arm64-$version"
          # ditto, not zip: it is the only zipper Apple's tooling agrees
          # preserves symlinks and the resource forks a signature lives in.
          ditto -c -k --keepParent "$bundle" "$RUNNER_TEMP/notarize.zip"

          # Write the private key out, and check it. The secret is meant to hold
          # the .p8 base64-encoded, but `base64 --decode` on macOS accepts a raw
          # PEM body without complaint and emits binary garbage at exit 0 — so
          # pasting the .p8 in unencoded produces a key file that is wrong in a
          # way nothing notices until Apple answers "401 Unauthenticated", which
          # names none of this. Accept both forms and verify the result.
          write_key() {
            if printf '%s' "$NOTARY_KEY" | grep -q 'BEGIN PRIVATE KEY'; then
              printf '%s\n' "$NOTARY_KEY" > "$RUNNER_TEMP/AuthKey.p8"
            else
              printf '%s' "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8" 2>/dev/null || true
            fi
            chmod 600 "$RUNNER_TEMP/AuthKey.p8"
            grep -q 'BEGIN PRIVATE KEY' "$RUNNER_TEMP/AuthKey.p8" || {
              echo "error: MACOS_NOTARY_KEY_P8_BASE64 did not yield a PEM private key" >&2
              echo "       expected the .p8 file base64-encoded:" >&2
              echo "         base64 -i AuthKey_XXXXXXXXXX.p8 | pbcopy" >&2
              echo "       decoded $(wc -c < "$RUNNER_TEMP/AuthKey.p8") bytes, first line:" >&2
              head -c 32 "$RUNNER_TEMP/AuthKey.p8" | od -c | head -1 >&2
              exit 1
            }
          }

          # Strip whitespace from the two identifiers before anything uses them.
          # This is not defensive tidying, it is the thing that broke the first
          # authenticated run: `base64 -i key.p8 | pbcopy` and a copy off the
          # App Store Connect page both carry a trailing newline, GitHub keeps
          # it in the secret verbatim, and `--key-id ABCDE12345$(printf '\n')`
          # is refused with "401 Unauthenticated" — the same answer an
          # unauthorised key gets. The credentials themselves were fine and
          # worked from a laptop, which is what made it puzzling.
          #
          # Safe for both: an App Store Connect key ID is alphanumeric and an
          # issuer ID is a UUID, so neither can legitimately contain
          # whitespace. Not applied to MACOS_CERT_PASSWORD, where whitespace is
          # a legitimate character, or to the key body, where the newlines are
          # part of the encoding and base64 ignores them anyway.
          NOTARY_KEY_ID=$(printf '%s' "$NOTARY_KEY_ID" | tr -d '[:space:]')
          NOTARY_ISSUER=$(printf '%s' "$NOTARY_ISSUER" | tr -d '[:space:]')

          # Shape checks on the two identifiers, after stripping. Lengths and
          # formats only — GitHub masks the values, not their sizes — but they
          # separate "the key is not authorised" from "the wrong string is in
          # the wrong secret", and a 401 says neither.
          echo "==> key id: ${#NOTARY_KEY_ID} chars, issuer: ${#NOTARY_ISSUER} chars"
          [ ${#NOTARY_KEY_ID} -eq 10 ] || \
            echo "::warning::MACOS_NOTARY_KEY_ID is ${#NOTARY_KEY_ID} characters; App Store Connect key IDs are 10"
          case "$NOTARY_ISSUER" in
            ????????-????-????-????-????????????) ;;
            *) echo "::warning::MACOS_NOTARY_ISSUER_ID is not a UUID (${#NOTARY_ISSUER} characters) — the Issuer ID is the UUID at the top of the Keys page, not the key ID" ;;
          esac

          # The issuer is appended only when the secret is set: it is required
          # for a team key and meaningless for an individual one, where the JWT
          # carries sub:"user" instead of iss, and passing it empty is an error.
          # ${VAR:+...} left unquoted so it expands to two words or none; a UUID
          # cannot contain whitespace, so there is nothing for the split to break.
          write_key
          AUTH="--key $RUNNER_TEMP/AuthKey.p8 --key-id $NOTARY_KEY_ID"

          # Ask a cheap question before pushing a 21 MB upload. `history`
          # authenticates and does nothing else, so a credential fault fails here
          # in seconds, with the same 401, instead of after the transfer.
          echo "==> checking the notary credentials"
          # shellcheck disable=SC2086
          xcrun notarytool history $AUTH ${NOTARY_ISSUER:+--issuer "$NOTARY_ISSUER"} \
                --output-format json >/dev/null || {
            echo "error: the notary credentials were refused" >&2
            echo "       401 means the key, the key ID and the issuer ID do not" >&2
            echo "       agree, or the key lacks the Developer role. The same" >&2
            echo "       three values can be checked locally in one command:" >&2
            echo "         xcrun notarytool history --key AuthKey_XXXXXXXXXX.p8 \\" >&2
            echo "           --key-id <KEY ID> --issuer <ISSUER UUID>" >&2
            rm -f "$RUNNER_TEMP/AuthKey.p8"
            exit 1
          }

          # Submit and do NOT wait. Apple's queue took over 30 minutes on the
          # first real submission and the job was killed holding a runner —
          # with the upload long finished and the result unknowable, which is
          # the worst of both. The upload is the part CI is good at; waiting is
          # not, and the release it feeds is a *draft* that a human publishes
          # anyway. So the submission id goes to the step summary and into the
          # draft's notes, and the accept/reject check moves to that human.
          #
          # What this gives up is real: nothing now fails the build when Apple
          # rejects the bundle. `notarytool submit --wait` would not have helped
          # much either — it exits 0 on a rejected submission as readily as an
          # accepted one, so the status field was always the only thing that
          # actually said. That check is now a step in todo.md, before publish.
          echo "==> submitting (not waiting — see the job summary)"
          # shellcheck disable=SC2086
          result=$(xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
                   $AUTH ${NOTARY_ISSUER:+--issuer "$NOTARY_ISSUER"} \
                   --output-format json)
          rm -f "$RUNNER_TEMP/AuthKey.p8"
          echo "$result"
          id=$(echo "$result" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("id",""))')
          [ -n "$id" ] || {
            echo "error: the submission returned no id — nothing was queued" >&2
            exit 1
          }
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "==> queued: $id"

          # The summary is where this is actually read: the run page shows it
          # without opening a log, and it carries the one command needed next.
          {
            echo "### macOS notarisation"
            echo
            echo "Submission \`$id\` was uploaded and **not waited on**."
            echo "Check it before publishing the draft release:"
            echo
            echo '```sh'
            echo "xcrun notarytool info $id \\"
            echo "  --key AuthKey_XXXXXXXXXX.p8 --key-id <KEY ID> --issuer <ISSUER UUID>"
            echo '```'
            echo
            echo "\`Accepted\` means the bundle is good and the draft can go out."
            echo "Anything else — and for the reasons, add \`log $id\` in place of \`info $id\`."
            echo
            echo "The ticket is not stapled (this is a .tar.gz, not an .app), so"
            echo "Gatekeeper verifies online on a user's first launch. Notarisation"
            echo "takes effect as soon as Apple accepts it; the artefact does not"
            echo "need rebuilding."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Tarball
        id: tar
        run: |
          set -eu
          version=$(git describe --tags --always --dirty)
          name="theoc-macos-arm64-$version"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.tar.outputs.name }}
          path: dist/*.tar.gz
          if-no-files-found: error

      # always(): a failed build must not leave the private key sitting in a
      # keychain on a runner, however ephemeral that runner is meant to be.
      - name: Discard the keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/AuthKey.p8"

  windows:
    name: windows-x64
    runs-on: ubuntu-24.04     # cross-built with mingw-w64; no Windows machine involved
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # pkg-config is not incidental: Unicorn's qemu/configure runs under CMake's
      # execute_process with no error checking, so without it the build fails
      # ~200 source files later as a missing config-target.h. wine is here to run
      # the smoke test on the cross-built .exe.
      - name: Toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            mingw-w64 cmake pkg-config nasm wine wine64

      # Both prefixes together: stage-win-deps.sh produces deps-win and drives
      # build-ffmpeg-min.sh into deps-ffmpeg-win, and neither is much use alone.
      - name: Cache staged Windows deps
        id: windeps
        uses: actions/cache@v4
        with:
          path: |
            port/deps-win
            port/deps-ffmpeg-win
          key: windeps-${{ hashFiles('tools/stage-win-deps.sh', 'tools/build-ffmpeg-min.sh') }}

      # Idempotent, so running it on a cache hit is cheap and proves the cache
      # actually holds what package-windows.sh needs rather than assuming it.
      - name: Stage dependencies
        run: tools/stage-win-deps.sh

      - name: Package
        run: tools/package-windows.sh

      # The same smoke test as Linux, with wine as the runner. Verified locally
      # against a cross-built bundle: 8f4b...w600, host+arch w6.
      - name: Smoke test
        env:
          WINEDEBUG: -all
          # Not /tmp: the runner user does not own it, and wine refuses to create
          # a configuration directory somewhere it does not own. Containers run
          # as root, so every local verification of this step passed on a path
          # that cannot work here. runner.temp is owned by the runner.
          WINEPREFIX: ${{ runner.temp }}/wineprefix
        run: |
          set -eu
          version=$(git describe --tags --always --dirty)
          bundle="dist/theoc-windows-x64-$version"
          [ -d "$bundle" ] || { echo "no bundle at $bundle" >&2; ls -la dist >&2; exit 1; }
          cd "$bundle"
          THEOC_SMOKE_RUNNER=wine "$GITHUB_WORKSPACE/tools/smoke-test.sh" bin/theoc.exe
          cd "$GITHUB_WORKSPACE"
          size=$(du -sm "$bundle" | cut -f1)
          echo "bundle size: ${size} MB"
          # ~7.4 MB with the minimal ffmpeg, ~119 MB with a stock one.
          if [ "$size" -gt 40 ]; then
            echo "FAIL: ${size} MB — the minimal ffmpeg did not make it in" >&2
            exit 1
          fi

      - name: Tarball
        id: tar
        run: |
          set -eu
          version=$(git describe --tags --always --dirty)
          name="theoc-windows-x64-$version"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.tar.outputs.name }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: [linux, macos, windows]
    # workflow_dispatch runs the builds and stops here.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Draft, never published. This is the gate: the tag builds and uploads,
      # and a human decides whether it becomes a release. GitHub attaches the
      # source archives to the tag automatically, so decision 3 is covered
      # without doing anything here.
      #
      # Deleting an existing draft first is not tidiness — force-pushing a tag
      # is the normal fix in this repo, and `gh release create` fails outright
      # on a tag that already has a release.
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTARIZATION_ID: ${{ needs.macos.outputs.notarization_id }}
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "==> replacing existing release for $tag"
            gh release delete "$tag" --yes
          fi
          # The notes are written to a file rather than passed inline: the
          # macOS paragraph is conditional, and the checklist has to survive
          # newlines that --notes on one line would eat.
          {
            printf 'Automated draft for `%s` (%s).\n\n' "$tag" "$GITHUB_SHA"
            printf 'Bundles below were built from this tag, and each one asserted its own\n'
            printf 'build stamp against the commit before upload.\n\n'
            printf '**Before publishing:**\n\n'
            if [ -n "$NOTARIZATION_ID" ]; then
              printf -- '- [ ] macOS notarisation is `Accepted` — CI submits without waiting,\n'
              printf -- '      so this is not checked by the build:\n\n'
              printf -- '      xcrun notarytool info %s \\\n' "$NOTARIZATION_ID"
              printf -- '        --key AuthKey_XXXXXXXXXX.p8 --key-id <KEY ID> --issuer <ISSUER UUID>\n\n'
            else
              printf -- '- [ ] **The macOS bundle is UNSIGNED** — no certificate was available\n'
              printf -- '      to this run. Do not publish it.\n'
            fi
            printf -- '- [ ] One real macOS session. The smoke test runs `THEOC_FIX_SAVE`,\n'
            printf -- '      which returns before Unicorn opens, so nothing here proves the\n'
            printf -- '      guest runs under the hardened runtime.\n'
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$tag" \
            --draft \
            --title "$tag" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            artifacts/*/*.tar.gz
