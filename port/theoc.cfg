# theoc.cfg — settings for the Theocracy port.
#
# Put this next to the theoc executable, or in the folder you run it from.
# Lines are  NAME = value.  Anything after # is a comment.
# Remove the # in front of a line to change that setting.
#
# The environment always wins:  THEOC_MUSIC_VOL=50 ./theoc  beats this file.
# Every setting, including ones not listed here, is documented in
# docs/porting/diagnostics.md.

# --- Display -----------------------------------------------------------------
#THEOC_FULLSCREEN  = 1      # default: off (windowed)
#THEOC_SCANLINES   = 35     # CRT scanlines, 0-90. default: 0 (off)
#THEOC_NO_HIDPI    = 1      # bigger, softer pixels on a Retina display. default: off
#THEOC_FRAME_MS    = 16     # frame ceiling in ms. 0 = uncapped. default: 16 (~60fps)

# --- Speed -------------------------------------------------------------------
# The province view runs at 12fps by design; this is the only pacing control the
# engine admits. Lower = faster, and no longer what the developers shipped.
#THEOC_PROVINCE_MS = 50     # default: 83 (12fps, stock)

# --- Sound -------------------------------------------------------------------
#THEOC_MUSIC_VOL   = 70     # CD music level, 0-100. default: 100
#THEOC_AUDIO_MS    = 120    # audio buffer in ms. raise if sound stutters. default: 120

# --- Startup -----------------------------------------------------------------
#THEOC_SKIP_MOVIES = 1      # skip the intro films. default: off
#THEOC_VIDEO_HOLD  = 2      # seconds the window stays up after quitting. default: 2

# --- Where the game files are ------------------------------------------------
# Only needed if you moved them. Paths are relative to where you run theoc.
#THEOC_DATA        = data/game    # installed game data
#THEOC_CD          = data/cd      # the CD contents
#THEOC_CD_AUDIO    = data/cd-uk   # ripped music tracks. default: auto-detected

# --- Extras ------------------------------------------------------------------
# The developer console the game shipped with: Alt+V opens it, Alt+C closes.
#THEOC_CONSOLE     = 1      # default: off
#THEOC_EDIT        = 1      # the game's own edit mode. default: off
#THEOC_REAL_LOCK   = 1      # enforce one-copy-at-a-time. default: off (two can run)
